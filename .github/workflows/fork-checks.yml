name: Fork checks

# Every PR into dev gets the quick naming checks. The full build is slow on GitHub, so it runs
# only on release PRs, where a failure blocks the version before fork-release.yml tags it, or
# on demand. The workflows inherited from upstream only watch main and are disabled on this fork.

on:
  pull_request:
    branches: [dev]
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

# An edit gets its own group, or retitling a release PR would cancel its build
concurrency:
  group: fork-checks-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'edited' && 'edit' || 'build' }}
  cancel-in-progress: true

jobs:
  naming:
    name: PR title and branch
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: "Title follows 'type: summary'"
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -Eq '^(feat|tweak|fix|chore|docs|refactor|perf|test|build|ci)(\([a-z-]+\))?: .+'; then
            echo "::error::PR title must be 'type: summary', got: $TITLE"
            exit 1
          fi

      - name: "Branch is 'type/name' or 'release/vX.Y.Z'"
        if: success() || failure()
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if ! printf '%s' "$BRANCH" | grep -Eq '^((feat|tweak|fix|chore|docs|refactor|perf|test|build|ci)/.+|release/v[0-9]+\.[0-9]+\.[0-9]+)$'; then
            echo "::error::branch must be 'type/name' or 'release/vX.Y.Z', got: $BRANCH"
            exit 1
          fi

  build:
    name: Build, detekt, lint, unit tests
    # an edit only rebuilds when it retargeted the PR
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.head_ref, 'release/') &&
       (github.event.action != 'edited' || github.event.changes.base != null))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # v5, not v6: v6 moves caching into a proprietary component under separate terms
      - uses: gradle/actions/setup-gradle@v5

      - name: Build, detekt, lint, unit tests
        run: ./gradlew assembleFossDebug detekt lintFossDebug testFossDebugUnitTest --console=plain

      - name: Keep the reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
